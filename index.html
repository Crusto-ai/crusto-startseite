<style>
  /* Inter lokal statt von Google-Servern (DSGVO) — variable Schrift, Gewichte 100–900 */
  @font-face {
    font-family: "Inter";
    src: url("fonts/inter-latin-var.woff2") format("woff2");
    font-weight: 100 900; font-style: normal; font-display: swap;
  }
  /* Bewusst nur ein Look: Nacht-Navy mit Ofenglut. Farben aus DESIGN.md (Navy 950/800, Akzent 400/500). */
  :root {
    color-scheme: dark;
    --bg: #060E1B;
    --bg-2: #0B182C;
    --ink: #EEF1F6;
    --muted: #7D92B3;
    --accent: #F28E46;
    --accent-deep: #EF6D10;
    --f-sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: radial-gradient(120% 90% at 50% 38%, var(--bg-2) 0%, var(--bg) 62%);
    background-color: var(--bg);
    color: var(--ink);
    font-family: var(--f-sans);
    font-feature-settings: "cv02", "cv03", "cv04", "cv11";
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  .glow {
    position: fixed; left: 50%; top: 44%; width: min(900px, 140vw); aspect-ratio: 1; max-width: none;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(239, 109, 16, .22) 0%, rgba(239, 109, 16, .06) 32%, transparent 62%);
    filter: blur(20px);
    animation: atmen 7s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes atmen { 50% { transform: translate(-50%, -50%) scale(1.12); opacity: .75; } }

  main {
    position: relative; z-index: 1; height: 100%;
    display: grid; place-items: center; padding-inline: 20px;
  }
  .stack { display: flex; flex-direction: column; align-items: center; gap: clamp(28px, 5vh, 44px); }

  .lockup { display: flex; align-items: center; gap: clamp(14px, 2.4vw, 26px); }
  .mark { width: clamp(84px, 13vw, 150px); height: auto; overflow: visible; color: var(--ink); filter: drop-shadow(0 0 18px rgba(242, 142, 70, .35)); }
  .wordmark {
    font-weight: 300; letter-spacing: .02em; line-height: 1;
    font-size: clamp(48px, 9.5vw, 116px);
    animation: auf 1s cubic-bezier(.2, .8, .2, 1) backwards 1.1s;
  }
  .wordmark b { font-weight: 400; color: var(--accent); }
  @media (max-width: 460px) { .lockup { flex-direction: column; } }

  .soon { display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .line { width: clamp(120px, 22vw, 220px); height: 1px; background: rgba(125, 146, 179, .25); position: relative; overflow: hidden; animation: breit .9s cubic-bezier(.2, .8, .2, 1) backwards 1.9s; }
  .line::after { content: ""; position: absolute; inset: 0; width: 40%; background: linear-gradient(90deg, transparent, var(--accent), transparent); animation: lauf 2.6s ease-in-out infinite 2.8s; transform: translateX(-100%); }
  @keyframes breit { from { transform: scaleX(0); } }
  @keyframes lauf { to { transform: translateX(260%); } }

  .label { font-weight: 500; font-size: clamp(12px, 1.3vw, 15px); letter-spacing: .5em; margin-right: -.5em; text-transform: uppercase; color: var(--muted); display: flex; }
  .label span { display: inline-block; animation: auf .7s cubic-bezier(.2, .8, .2, 1) backwards; animation-delay: calc(2.1s + var(--i) * 55ms); }
  .label .gap { width: .6em; }
  @keyframes auf { from { opacity: 0; transform: translateY(10px); filter: blur(6px); } }

  /* Laib zeichnet sich, Einschnitte folgen, Stern springt auf und funkelt danach in Ruhe weiter */
  .draw { stroke-dasharray: 1; stroke-dashoffset: 0; animation: zeichnen 1.4s cubic-bezier(.65, 0, .35, 1) backwards .2s; }
  .c1 { animation-duration: .35s; animation-delay: 1.25s; }
  .c2 { animation-duration: .35s; animation-delay: 1.38s; }
  .c3 { animation-duration: .35s; animation-delay: 1.51s; }
  @keyframes zeichnen { from { stroke-dashoffset: 1; } }
  .sparkle { transform-origin: 118px 16px; transform-box: view-box; animation: pop .6s cubic-bezier(.3, 1.6, .5, 1) backwards 1.7s, funkeln 4s ease-in-out infinite 3s; }
  @keyframes pop { from { transform: scale(0) rotate(-60deg); opacity: 0; } }
  @keyframes funkeln { 0%, 80%, 100% { transform: scale(1) rotate(0); } 88% { transform: scale(1.35) rotate(45deg); } }

  .legal {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 2;
    display: flex; justify-content: center; gap: 22px;
    padding: 0 16px calc(18px + env(safe-area-inset-bottom, 0px));
    font-size: 12.5px; letter-spacing: .02em;
  }
  .legal a { color: rgba(125, 146, 179, .7); text-decoration: none; transition: color .15s; }
  .legal a:hover, .legal a:focus-visible { color: var(--ink); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
  }
</style>

</head>
<body>
<canvas id="glut" aria-hidden="true"></canvas>
<div class="glow" aria-hidden="true"></div>

<main>
  <div class="stack">
    <h1 class="lockup" aria-label="crusto.ai" style="margin:0;font-size:inherit">
      <!-- Pfade wörtlich aus CrustoAiLogo.tsx (viewBox 16 4 118 78) -->
      <svg class="mark" viewBox="16 4 118 78" aria-hidden="true">
        <g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <path class="draw" pathLength="1" d="M20 60 C20 40 40 30 65 30 C90 30 110 40 110 60 C110 68 92 74 65 74 C38 74 20 68 20 60 Z"/>
          <path class="draw c1" pathLength="1" d="M48 50 L56 40"/>
          <path class="draw c2" pathLength="1" d="M60 52 L68 42"/>
          <path class="draw c3" pathLength="1" d="M72 50 L80 40"/>
        </g>
        <path class="sparkle" fill="#F28E46" d="M118 8 C118 14 120 16 127 16 C120 16 118 18 118 24 C118 18 116 16 109 16 C116 16 118 14 118 8 Z"/>
      </svg>
      <span class="wordmark" aria-hidden="true">crusto<b>.ai</b></span>
    </h1>
  </div>
</main>

<footer class="legal">
  <a href='/impressum'>Impressum</a>
  <a href='/datenschutz'>Datenschutz</a>
</footer>

<script>
  // Aufsteigende Glutfunken: wenige, langsam, mit leichtem Seitenwind. Folgt der Maus ein wenig.
  (function () {
    var still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var c = document.getElementById('glut'), ctx = c.getContext('2d');
    var dpr = Math.min(window.devicePixelRatio || 1, 2), W = 0, H = 0, funken = [], mx = 0.5;
    function groesse() {
      W = c.clientWidth; H = c.clientHeight;
      c.width = W * dpr; c.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function neu(zufallsHoehe) {
      return {
        x: Math.random() * W,
        y: zufallsHoehe ? Math.random() * H : H + 10,
        r: 0.6 + Math.random() * 1.8,
        v: 0.15 + Math.random() * 0.45,
        phase: Math.random() * Math.PI * 2,
        leben: 0.35 + Math.random() * 0.65
      };
    }
    function start() {
      groesse();
      var anzahl = Math.round(Math.min(140, (W * H) / 11000));
      funken = [];
      for (var i = 0; i < anzahl; i++) funken.push(neu(true));
    }
    function bild(t) {
      ctx.clearRect(0, 0, W, H);
      ctx.globalCompositeOperation = 'lighter';
      for (var i = 0; i < funken.length; i++) {
        var f = funken[i];
        f.y -= f.v;
        f.x += Math.sin(t / 1800 + f.phase) * 0.25 + (mx - 0.5) * 0.35 * f.v;
        if (f.y < -10) funken[i] = f = neu(false);
        var hoehe = 1 - f.y / H;                       // oben verglühen
        var a = Math.max(0, f.leben * (1 - hoehe * 0.9)) * (0.6 + 0.4 * Math.sin(t / 300 + f.phase));
        var g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r * 5);
        g.addColorStop(0, 'rgba(255, 190, 130,' + a.toFixed(3) + ')');
        g.addColorStop(0.35, 'rgba(242, 142, 70,' + (a * 0.55).toFixed(3) + ')');
        g.addColorStop(1, 'rgba(239, 109, 16, 0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(f.x, f.y, f.r * 5, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalCompositeOperation = 'source-over';
      if (!still) requestAnimationFrame(bild);
    }
    window.addEventListener('resize', start);
    window.addEventListener('pointermove', function (e) { mx = e.clientX / (W || 1); });
    start();
    requestAnimationFrame(bild);
  })();
</script>

</body>
